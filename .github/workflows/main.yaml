name: LLM Twin 3-Pipeline FTI CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  continuous-integration-and-evaluation-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Flake8
        run: |
          flake8 src/ app.py tests/ --max-line-length=120 --ignore=E501,W503,E402,E203

      - name: Run Unit & Integration Tests (LLaMA/Mistral + FTI Pipelines + FastAPI)
        run: |
          pytest tests/ -v

      - name: Verify LLM Twin Evaluation Gate (ROUGE-L & Style Alignment)
        run: |
          python -c "import json; r=json.load(open('artifacts/training/evaluation_report.json')); assert r['evaluation_gate']['promotion_approved'], 'Evaluation Gate Failed!'"

  continuous-deployment-dockerhub:
    needs: continuous-integration-and-evaluation-gate
    if: github.ref == 'refs/heads/main' && false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push LLM Twin Docker Image
        run: |
          docker build -t 29omchavan/mlops-project-4-llm-twin-system:latest .
          docker push 29omchavan/mlops-project-4-llm-twin-system:latest
